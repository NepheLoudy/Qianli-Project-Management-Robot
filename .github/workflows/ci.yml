name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-widget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        working-directory: widget
        run: npm ci

      - name: Build widget
        working-directory: widget
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: widget-build
          path: widget/dist/

  check-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Validate server config
        working-directory: server
        run: node -e "require('./src/config')"

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install eslint
        run: npm install -g eslint

      - name: Lint server
        working-directory: server
        run: eslint src/ --ext .js || true

      - name: Lint widget
        working-directory: widget
        run: eslint src/ --ext .ts,.tsx || true
