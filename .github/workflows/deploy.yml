name: Deploy

# 已停用 push 自动部署：现部署统一走项目内 `npm run push`（SFTP），
# 且本工作流生成的 .env 模板（旧端口/长连接=true/缺 TICKET_* 等键）会覆盖 push 上传的正确配置。
# 仅保留手动触发入口，供紧急时人工使用；启用前须先同步下方 env 生成段。
on:
  workflow_dispatch:

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_PROJECT_TABLE_ID: ${{ secrets.BITABLE_PROJECT_TABLE_ID }}
          BITABLE_LOG_TABLE_ID: ${{ secrets.BITABLE_LOG_TABLE_ID }}
          BITABLE_KEYWORD_TABLE_ID: ${{ secrets.BITABLE_KEYWORD_TABLE_ID }}
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          CHAT_CHAT_ID: ${{ secrets.CHAT_CHAT_ID }}
          KEYWORD_CHAT_ID: ${{ secrets.KEYWORD_CHAT_ID }}
          BOT2_WEBHOOK_URL: ${{ secrets.BOT2_WEBHOOK_URL }}
          BOT2_CHAT_ID: ${{ secrets.BOT2_CHAT_ID }}
          OWNER_WEBHOOK_URL: ${{ secrets.OWNER_WEBHOOK_URL }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          DKYJ_WEBHOOK_URL: ${{ secrets.DKYJ_WEBHOOK_URL }}
          DKYJ_CHAT_ID: ${{ secrets.DKYJ_CHAT_ID }}
          SJ_WEBHOOK_URL: ${{ secrets.SJ_WEBHOOK_URL }}
          SJ_CHAT_ID: ${{ secrets.SJ_CHAT_ID }}
          XY_WEBHOOK_URL: ${{ secrets.XY_WEBHOOK_URL }}
          XY_CHAT_ID: ${{ secrets.XY_CHAT_ID }}
          MEETING_CHAT_IDS: ${{ secrets.MEETING_CHAT_IDS }}
          PRINT_SERVER_URL: ${{ secrets.PRINT_SERVER_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no -p $SERVER_PORT $SERVER_USER@$SERVER_HOST "
            if [ ! -d $DEPLOY_PATH ]; then
              mkdir -p $DEPLOY_PATH
              cd $DEPLOY_PATH
              git init
              git remote add origin https://github.com/NepheLoudy/Qianli-Project-Management-Robot.git
            fi
            cd $DEPLOY_PATH
            git fetch origin main
            git reset --hard origin/main
            
            cd server
            npm ci --production
            
            cat > .env << EOF
APP_ID=${APP_ID}
APP_SECRET=${APP_SECRET}
BITABLE_APP_TOKEN=${BITABLE_APP_TOKEN}
BITABLE_PROJECT_TABLE_ID=${BITABLE_PROJECT_TABLE_ID}
BITABLE_LOG_TABLE_ID=${BITABLE_LOG_TABLE_ID}
BITABLE_KEYWORD_TABLE_ID=${BITABLE_KEYWORD_TABLE_ID}
FEISHU_VERIFICATION_TOKEN=
FEISHU_ENCRYPT_KEY=
FEISHU_USE_LONG_CONNECTION=true
BOT_NAME=${BOT_NAME}
BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL}
CHAT_CHAT_ID=${CHAT_CHAT_ID}
KEYWORD_CHAT_ID=${KEYWORD_CHAT_ID}
PORT=2174
NODE_ENV=production
CRON_SCHEDULE=0 0 12 * * *
DDL_ALERT_DAYS=2
BOT2_WEBHOOK_URL=${BOT2_WEBHOOK_URL}
BOT2_CHAT_ID=${BOT2_CHAT_ID}
OWNER_WEBHOOK_URL=${OWNER_WEBHOOK_URL}
OWNER_CHAT_ID=${OWNER_CHAT_ID}
DKYJ_WEBHOOK_URL=${DKYJ_WEBHOOK_URL}
DKYJ_CHAT_ID=${DKYJ_CHAT_ID}
SJ_WEBHOOK_URL=${SJ_WEBHOOK_URL}
SJ_CHAT_ID=${SJ_CHAT_ID}
XY_WEBHOOK_URL=${XY_WEBHOOK_URL}
XY_CHAT_ID=${XY_CHAT_ID}
MEETING_CHAT_IDS=${MEETING_CHAT_IDS}
PRINT_SERVER_URL=${PRINT_SERVER_URL}
EOF
            
            pm2 delete knowledge-tracker 2>/dev/null || true
            pm2 start src/index.js --name knowledge-tracker
            pm2 save
          "
